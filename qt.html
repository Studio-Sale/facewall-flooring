<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>รับคำขอใบเสนอราคา | FACEWALL QT</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/estimator.css">
<script defer src="js/qt-import.js"></script>
</head>
<body>
<main class="estimate">
  <div class="wrap">
    <div class="estimate-intro"><a href="estimator.html">กลับหน้าประเมินราคา</a><h1>FACEWALL QT</h1><p>คัดลอกข้อความขอใบเสนอราคาทั้งข้อความจาก LINE แล้ววางด้านล่าง</p></div>
    <div class="estimate-grid">
      <form id="qt-form" class="estimate-inputs">
        <label for="qt-message">ข้อความจาก LINE</label>
        <textarea id="qt-message" required rows="12" spellcheck="false"></textarea>
        <button type="submit" class="btn btn-dark">อ่านข้อมูลคำขอ</button>
        <p id="qt-status" role="status"></p>
      </form>
      <section class="estimate-inputs" aria-labelledby="qt-result-title">
        <h2 id="qt-result-title">ข้อมูลที่อ่านได้</h2>
        <div id="qt-result">รอข้อความจาก LINE</div>
      </section>
    </div>
  </div>
</main>
</body>
</html>
